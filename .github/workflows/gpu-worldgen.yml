name: gpu-worldgen

# The checks of the gpu-worldgen branch on GitHub's own runners. They have no NVIDIA GPU and no game files,
# so this runs what needs neither: rustfmt, clippy -D warnings (the whole workspace with the CUDA backend
# compiled, which needs no CUDA toolkit; the server build and horizon-gpu without it) and the unit tests of
# the crates that need no prepared resources. The probe in the three dimensions, the vanilla parity and the
# GPU runs go through `python3 tools/gpu_worldgen.py verify` on a machine with an NVIDIA GPU and the game
# files (crates/horizon-gpu/BENCHMARKS.md).

on:
  push:
    branches: [gpu-worldgen]
  pull_request:
    branches: [gpu-worldgen]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gpu-worldgen-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    # Upstream runs its own CI; this one is for the fork
    if: github.repository != 'horizon-rust/horizon'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: Room for the build
        # The runner's preinstalled SDKs take space the workspace's build needs
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: clippy, the workspace (CUDA backend compiled)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: clippy, the server build without CUDA
        run: cargo clippy -p horizon-client --all-targets --locked --no-default-features -- -D warnings
      - name: clippy, horizon-gpu without CUDA
        run: cargo clippy -p horizon-gpu --all-targets --locked -- -D warnings
      - name: unit tests (no GPU, no game files)
        run: cargo test --locked -p horizon-gpu -p horizon-core --lib
      - name: NVRTC, for the kernels' compilation (a compiler library, no GPU needed)
        run: |
          python3 -m venv "$RUNNER_TEMP/nvrtc"
          "$RUNNER_TEMP/nvrtc/bin/pip" install --quiet nvidia-cuda-nvrtc-cu12
          lib=$("$RUNNER_TEMP/nvrtc/bin/python" -c 'import nvidia.cuda_nvrtc, os; print(os.path.join(list(nvidia.cuda_nvrtc.__path__)[0], "lib"))')
          echo "LD_LIBRARY_PATH=$lib" >> "$GITHUB_ENV"
      - name: the GPU kernels compile with NVRTC
        run: HORIZON_REQUIRE_NVRTC=1 cargo test --locked -p horizon-gpu --features cuda --lib nvrtc
      - name: horizon-world's tests (those that need the game's files skip without them)
        run: cargo test --locked -p horizon-world
      - name: the layer check (docs/layers.md)
        run: python3 tools/check_layers.py
      - name: every daily test has its row (tools/ci/ignored-tests)
        run: python3 tools/ci/check_ignored_test_rows.py
